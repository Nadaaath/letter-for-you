name: CI

on:
  push:
    branches:
      - main
      - devops/**
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend-check:
    name: Backend check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

  docker-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - backend-check
      - docker-lint
      - secret-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  trivy-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t letter-for-you-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t letter-for-you-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: letter-for-you-backend:ci
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: letter-for-you-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: 0